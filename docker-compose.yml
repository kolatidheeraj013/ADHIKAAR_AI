services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adhikaar
      POSTGRES_USER: adhikaar
      POSTGRES_PASSWORD: adhikaar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - mock_portal

  mock_portal:
    build: ./mock_portal
    env_file: .env
    ports:
      - "8100:8100"

  telegram_bot:
    build: ./telegram_bot
    env_file: .env
    ports:
      - "8200:8200"
    depends_on:
      - backend

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
