name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Lint (Ruff)
        run: uv run --isolated --project backend --extra test ruff check backend telegram_bot mock_portal

      - name: Run Backend Tests
        run: uv run --isolated --project backend --extra test pytest backend/tests

      - name: Run Telegram Bot Tests
        run: uv run --isolated --project telegram_bot --extra test pytest telegram_bot/tests

      - name: Run Mock Portal Tests
        run: uv run --isolated --project mock_portal --extra test pytest mock_portal/tests
